name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# No job ever downloads, installs or reads Windows: the tests that need
# drive C: report NEEDS-WIN98 and do not count as failures.
jobs:
  release-check:
    name: Release check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check every tracked file
        run: python3 tools/check_release.py
      - name: Test the checks
        run: python3 -m unittest tools/test_release_check.py tools/test_release_export.py

  linux-x64:
    name: Build and test (Linux x64)
    needs: release-check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NEO98_LLVM_BIN: /usr/lib/llvm-18/bin
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18 \
            libsdl2-dev libgtk-3-dev cmake ninja-build python3-venv pkg-config zlib1g-dev \
            libvulkan-dev libshaderc-dev glslang-tools mesa-vulkan-drivers \
            libdrm-dev libinput-dev libudev-dev mtools
      - uses: actions/cache@v4
        with:
          path: |
            third_party
            build/dosbox-pure-host
            build/release-downloads
          key: linux-x64-deps-${{ hashFiles('sdk/dependencies.json', 'tools/build_dosbox_pure.py', 'tools/dosbox_pure_*.h') }}
      - name: Build
        run: python3 neo98.py build
      - name: Public tests
        run: python3 tools/test_public.py --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-tests-linux-x64
          path: |
            build/public-tests/*.log
            build/public-tests/results.json
          if-no-files-found: ignore
          retention-days: 14

  macos-arm64:
    name: Build and test (macOS 15 arm64)
    needs: release-check
    runs-on: macos-15
    timeout-minutes: 150
    env:
      # LLVM 21: the version src/state_rules/frames.calls is reviewed against;
      # with LLVM 22 and later the host cannot save Windows programs.
      NEO98_LLVM_BIN: /opt/homebrew/opt/llvm@21/bin
      NEO98_NATIVE_JOBS: '3'
      NEO98_WITH_HOST_MEDIA: '0'
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - name: Check architecture
        run: test "$(uname -m)" = arm64
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            third_party
            build/fex-host
            build/unicorn-host
            build/dosbox-pure-host
            build/release-downloads
          key: macos15-deps-${{ hashFiles('fex/dependencies.json', 'unicorn/dependencies.json', 'sdk/dependencies.json', 'tools/build_fex*.py', 'tools/build_unicorn_host.py', 'tools/build_dosbox_pure.py', 'tools/dosbox_pure_*.h') }}
      - name: Install build dependencies
        run: brew install llvm@21 lld cmake ninja pkg-config sdl2 python
      - name: Build
        run: python3 neo98.py build
      - name: Public tests
        run: python3 tools/test_public.py --jobs 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-tests-macos-arm64
          path: |
            build/public-tests/*.log
            build/public-tests/results.json
          if-no-files-found: ignore
          retention-days: 14
