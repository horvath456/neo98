name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      NEO98_NATIVE_JOBS: '3'
      NEO98_WITH_HOST_MEDIA: '0'
      SDL_AUDIODRIVER: dummy
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check architecture
        run: test "$(uname -m)" = arm64
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            third_party
            build/fex-host
            build/unicorn-host
            build/dosbox-pure-host
            build/release-downloads
            build/toolkit-downloads
          key: macos15-deps-${{ hashFiles('fex/dependencies.json', 'unicorn/dependencies.json', 'sdk/dependencies.json', 'tools/build_fex*.py', 'tools/build_unicorn_host.py', 'tools/build_dosbox_pure.py', 'tools/dosbox_pure_*.h', 'tools/setup_toolkit.json') }}
      - name: Install build dependencies
        # glib, pixman and tesseract: the setup toolkit the app carries
        # (tools/setup_toolkit.py), so users need no Homebrew.
        run: brew install llvm lld cmake ninja pkg-config sdl2 python glib pixman tesseract
      - name: Import optional signing identity
        if: env.MACOS_CERT_P12 != '' && env.MACOS_CERT_PASSWORD != '' && env.NOTARY_KEY_P8 != '' && env.NOTARY_KEY_ID != '' && env.NOTARY_ISSUER_ID != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'signing.p12').write_bytes(base64.b64decode(os.environ['MACOS_CERT_P12']))
          PY
          KEYCHAIN="$RUNNER_TEMP/neo98.keychain-db"
          PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')
          test -n "$IDENTITY"
          echo "NEO98_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build disk image and corresponding sources
        run: python3 tools/make_release_assets.py
      - name: Notarize and staple optional signed release
        if: env.MACOS_CERT_P12 != '' && env.MACOS_CERT_PASSWORD != '' && env.NOTARY_KEY_P8 != '' && env.NOTARY_KEY_ID != '' && env.NOTARY_ISSUER_ID != ''
        shell: bash
        run: |
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit build/release-assets/Neo98.dmg --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --timeout 20m
          xcrun stapler staple build/release-assets/Neo98.dmg
          python3 tools/make_release_assets.py --checksums-only
      - uses: actions/upload-artifact@v4
        with:
          name: neo98-release-macos
          path: build/release-assets/Neo98.dmg
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: neo98-third-party-sources
          path: build/release-assets/third-party-sources/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/neo98.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary.p8"

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEO98_LLVM_BIN: /usr/lib/llvm-18/bin
      NEO98_WITH_HOST_MEDIA: '0'
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18 \
            libsdl2-dev libgtk-3-dev cmake ninja-build python3-venv pkg-config zlib1g-dev \
            libvulkan-dev libshaderc-dev glslang-tools libdrm-dev libinput-dev libudev-dev \
            libglib2.0-dev libpixman-1-dev tesseract-ocr tesseract-ocr-eng patchelf desktop-file-utils
      - uses: actions/cache@v4
        with:
          path: |
            third_party
            build/dosbox-pure-host
            build/toolkit-downloads
          key: linux-x64-release-deps-${{ hashFiles('sdk/dependencies.json', 'tools/build_dosbox_pure.py', 'tools/dosbox_pure_*.h', 'tools/setup_toolkit.json') }}
      - name: Build the Linux package
        run: python3 tools/make_release_assets.py --no-sources
      - uses: actions/upload-artifact@v4
        with:
          name: neo98-release-linux
          path: build/release-assets/Neo98-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: neo98-release-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: neo98-third-party-sources
          path: sources
      - name: Checksums of all assets
        working-directory: assets
        run: |
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: neo98-release
          path: assets/*
          retention-days: 7
      - name: Attach assets to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The sources of the GPL components in the packages are published once
          # per set of pins and patches, in a release of their own named after
          # the checksum of their reproducible archives. A new Neo98 release
          # links to it, and attaches only the packages.
          key=$(sha256sum sources/SHA256SUMS | cut -c1-12)
          sources="sources-$key"
          if gh release view "$sources" >/dev/null 2>&1; then
            gh release download "$sources" --pattern SHA256SUMS --output published-sums
            cmp published-sums sources/SHA256SUMS
          else
            printf '%s\n' \
              "Source code of the GPL components inside the Neo98 packages: Unicorn and DOSBox Pure" \
              "with Neo98's changes, the FreeDOS boot sector, and QEMU, mtools and cabextract of the" \
              "setup toolkit. Every Neo98 release links to the sources it was built from; Neo98's own" \
              "source code is the source archive of that release." > sources-notes.md
            gh release create "$sources" sources/* --target "$GITHUB_SHA" --latest=false \
              --title "Third-party sources $key" --notes-file sources-notes.md
          fi
          link="https://github.com/$GH_REPO/releases/tag/$sources"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft
          gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          gh release view "$GITHUB_REF_NAME" --json body -q .body > notes.md
          if ! grep -qF "$link" notes.md; then
            printf '\nSource code of the GPL components in these packages: %s\n' "$link" >> notes.md
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          fi
