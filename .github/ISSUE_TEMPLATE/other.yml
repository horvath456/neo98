name: Something else
description: Setting up Windows, Neo98 itself, the packages, or an idea.
body:
  - type: markdown
    attributes:
      value: |
        Please don't attach Windows files or your product key.
  - type: textarea
    id: what
    attributes:
      label: What is it about
      description: What you did, what happened and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Neo98 version
      placeholder: "0.2.6"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Your computer
      description: The macOS version and Mac model, or the Linux distribution with its version.
      placeholder: "macOS 15.1 on a MacBook Air M2 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Logs and pictures
      description: Neo98's logs are in `~/Library/Logs/Neo98` on the Mac and in `~/.local/state/neo98` on Linux.
